services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: convomind_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-convomind_prod_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-convomind_prod_password}
      POSTGRES_DB: ${POSTGRES_DB:-convomind_prod_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-convomind_prod_user} -d ${POSTGRES_DB:-convomind_prod_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - convomind_prod_network

  redis:
    image: redis:7-alpine
    container_name: convomind_prod_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - convomind_prod_network

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: convomind_prod_api
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    volumes:
      - storage_data:/app/storage
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-convomind_prod_user}:${POSTGRES_PASSWORD:-convomind_prod_password}@postgres:5432/${POSTGRES_DB:-convomind_prod_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - TRANSCRIPTION_PROVIDER=${TRANSCRIPTION_PROVIDER:-whisper}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - WHISPER_MODEL=${WHISPER_MODEL:-whisper-1}
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - convomind_prod_network

  celery_worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: convomind_prod_celery_worker
    restart: always
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - storage_data:/app/storage
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-convomind_prod_user}:${POSTGRES_PASSWORD:-convomind_prod_password}@postgres:5432/${POSTGRES_DB:-convomind_prod_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - TRANSCRIPTION_PROVIDER=${TRANSCRIPTION_PROVIDER:-whisper}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - WHISPER_MODEL=${WHISPER_MODEL:-whisper-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - convomind_prod_network

  nginx:
    image: nginx:1.27-alpine
    container_name: convomind_prod_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./apps/web/dist:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - convomind_prod_network

volumes:
  postgres_data:
    name: convomind_prod_postgres_data
  redis_data:
    name: convomind_prod_redis_data
  storage_data:
    name: convomind_prod_storage_data

networks:
  convomind_prod_network:
    name: convomind_prod_network
    driver: bridge
